name: test suite

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector to run a subset of tests"
        required: false
        default: ""

jobs:
  changed-files:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workflow-changed: ${{ steps.changed-files.outputs.workflow_any_changed }}
      pyproject-changed: ${{ steps.changed-files.outputs.src_any_changed }}
      src-changed: ${{ steps.changed-files.outputs.src_any_changed }}
      tests-changed: ${{ steps.changed-files.outputs.tests_any_changed }}
      docs-changed: ${{ steps.changed-files.outputs.doc_any_changed }}
    steps:
    - uses: actions/checkout@v6
    - name: Get changed files by category
      id: changed-files
      uses: tj-actions/changed-files@v47
      with:
        files_yaml: |
          workflow:
          - .github/workflows/test.yml
          pyproject:
          - pyproject.toml
          src:
          - src/**
          tests:
          - tests/**
          doc:
          - README.rst
          - docs/**

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-pyright
    - name: Install dependencies
      run: pip install -e . pyright
    - name: Run pyright
      run: pyright --ignoreexternal --verifytypes anyio

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10.19", "3.11.14", "3.12.12", "3.13.9", "3.14.0", pypy-3.11-v7.3.20]
        extras: ["[trio]"]
        lowest-bound: [false]
        include:
        - os: macos-latest
          python-version: "3.9"
          extras: "[trio]"
        - os: macos-latest
          python-version: "3.14.0"
          extras: "[trio]"
        - os: windows-latest
          python-version: "3.9"
          extras: "[trio]"
        - os: windows-latest
          python-version: "3.14.0"
          extras: "[trio]"
        - name: only asyncio
          os: ubuntu-latest
          python-version: "3.14.0"
          extras: ""
        - name: oldest dependencies
          os: ubuntu-latest
          python-version: "3.9"
          extras: "[trio]"
          lowest-bound: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Reserve the fixed test port 54321 from ephemeral port allocation
      if: runner.os == 'Linux'
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54321
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the project and its dependencies
      if: matrix.lowest-bound == false
      run: pip install --group test -e .${{ matrix.extras }} "pytest<9.1"
    - name: Install the project and its dependencies (lowest bound)
      if: matrix.lowest-bound == true
      run: |
        pip install uv
        uv pip install --system --resolution lowest-direct --group test -e .${{ matrix.extras }}
    - name: Patch /etc/hosts
      if: runner.os != 'Windows'
      run: |
        echo "1.2.3.4 xn--fa-hia.de" | sudo tee -a /etc/hosts
        echo "5.6.7.8 fass.de" | sudo tee -a /etc/hosts
    - name: Patch C:\Windows\System32\drivers\etc\hosts
      if: runner.os == 'Windows'
      run: |
        Add-Content -Path C:\Windows\System32\drivers\etc\hosts -Value "1.2.3.4 xn--fa-hia.de"
        Add-Content -Path C:\Windows\System32\drivers\etc\hosts -Value "5.6.7.8 fass.de"
    - name: Test with pytest
      run: coverage run -m pytest -v --junitxml=junit.xml ${{ inputs.test-filter }}
      timeout-minutes: 15
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
    - name: Generate coverage report
      run: coverage xml
    - name: Summarize test results and skip reasons
      if: always()
      shell: python
      run: |
        import collections
        import xml.etree.ElementTree as ET

        root = ET.parse("junit.xml").getroot()
        cases = list(root.iter("testcase"))
        skips = collections.Counter()
        outcome = collections.Counter()
        for case in cases:
            skipped = case.find("skipped")
            if skipped is not None:
                outcome["skipped"] += 1
                skips[skipped.get("message", "")] += 1
            elif case.find("failure") is not None:
                outcome["failed"] += 1
            elif case.find("error") is not None:
                outcome["error"] += 1
            else:
                outcome["passed"] += 1
        print(f"TEST RESULTS: {len(cases)} testcases: {dict(outcome)}")
        print("Optional dependencies are installed per leg by pyproject.toml markers:")
        print("  truststore: python_version >= '3.10' (not installable on 3.9)")
        print("  uvloop: CPython and not Windows (absent on PyPy and Windows)")
        print("  winloop: CPython and Windows (absent on Linux and macOS)")
        print("  trio: only via the [trio] extra (absent on the 'only asyncio' leg)")
        print("  sniffio: not an anyio or test dependency; installed only transitively")
        print("           by trio, so it is absent on the 'only asyncio' leg")
        print(f"SKIP REASONS ({sum(skips.values())} skipped):")
        for reason, count in sorted(skips.items(), key=lambda kv: -kv[1]):
            print(f"  {count:5d} x {reason}")

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the project and its dependencies
      run: pip install --group doc -e .
    - name: Build documentation
      run: sphinx-build -W docs build/sphinx

  coveralls:
    name: Finish Coveralls
    needs: test
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
